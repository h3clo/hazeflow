<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haze Flow · 토스 비공개 설정</title><style>body{font:15px -apple-system,sans-serif;color:#303848;background:#f5f7fa;margin:0;padding:32px}main{max-width:560px;margin:20px auto;background:#fff;border:1px solid #e4e9ef;border-radius:20px;padding:28px}p{line-height:1.8;color:#647085}label{display:grid;gap:8px;margin:22px 0}input,button{font:inherit;border:1px solid #dce3eb;border-radius:10px;padding:12px}button{background:#3978ec;color:white;cursor:pointer}button:disabled{opacity:.5}#result{white-space:pre-wrap;line-height:1.8}small{color:#647085}</style><main><small>HAZE FLOW · 이 맥에서만 열리는 설정</small><h1>토스 조회 연결</h1><p>키는 이 맥의 비공개 파일에 보관해요. Haze Flow 웹·앱에는 키를 넣지 않아요. 조회 기능만 사용해요.</p><p>토스에서 재발급했다면 Client Id와 Secret을 모두 새 값으로 넣어주세요.</p><form id="setup"><label>Client Id<input name="clientId" type="password" autocomplete="off" required></label><label>Client Secret 원본<input name="clientSecret" type="password" autocomplete="off" required></label><label>Haze Flow 로그인 이메일<input name="ownerEmail" type="email" autocomplete="email" required></label><button>이 맥에 키 저장</button></form><p id="feedback" role="status"></p><button id="test" type="button">조회 연결 확인</button><p id="result"></p><p>아이폰·다른 기기에서 계속 쓰려면 외부 서버 연결이 추가로 필요해요. 지금은 이 맥에서 연결을 확인하는 단계예요.</p></main><script>const token='__NONCE__';async function request(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':token},body:JSON.stringify(data||{})});const result=await r.json();if(!r.ok)throw Error(result.error);return result}document.querySelector('#setup').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;try{await request('/setup/save',Object.fromEntries(new FormData(f)));f.reset();document.querySelector('#feedback').textContent='키를 이 맥에 저장했어요. 조회 연결 확인을 눌러주세요.'}catch(error){document.querySelector('#feedback').textContent=error.message}finally{b.disabled=false}};document.querySelector('#test').onclick=async e=>{e.target.disabled=true;try{const p=await request('/setup/test');document.querySelector('#result').textContent='주식 평가액 '+p.total.toLocaleString('ko-KR')+'원\n'+(p.usdKrw?'USD/KRW 매매기준율 '+p.usdKrw+'\n':'')+p.rows.map(r=>r.name+' · '+r.quantity+'주 · '+r.value.toLocaleString('ko-KR')+'원').join('\n')}catch(error){document.querySelector('#result').textContent=error.message}finally{e.target.disabled=false}};</script></html>
