<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haze Flow · 토스 조회 연결</title><style>body{font:15px -apple-system,sans-serif;background:#f5f7fa;color:#303848;padding:28px;line-height:1.8}main{background:white;border:1px solid #e4e9ef;border-radius:16px;padding:24px}h1{font-size:20px}small{color:#647085}</style><main><small>HAZE FLOW</small><h1>토스 조회 연결창</h1><p id="status" role="status">Haze Flow의 조회 요청을 기다리고 있어요.</p><p>이 창을 열어두면 원래 자산 화면에서 30초마다 갱신해요. 이 맥에서만 연결돼요.</p></main><script>const params=new URLSearchParams(location.hash.slice(1)),nonce=params.get('nonce'),parent=params.get('parent'),allowed=new Set(['https://h3clo.github.io','http://localhost:5173','http://127.0.0.1:5173']);if(opener&&nonce&&allowed.has(parent))opener.postMessage({type:'ready',nonce},parent);window.addEventListener('message',async e=>{if(e.source!==opener||!allowed.has(e.origin)||e.data?.nonce!==nonce||e.data.type!=='query'||typeof e.data.token!=='string')return;document.querySelector('#status').textContent='본인 계정을 확인하고 토스 주식을 조회하고 있어요.';try{const response=await fetch('/portfolio',{headers:{Authorization:'Bearer '+e.data.token},signal:AbortSignal.timeout(40000)}),result=await response.json();if(!response.ok)throw Error(result.error||'조회에 실패했어요.');opener.postMessage({type:'result',nonce,id:e.data.id,result},e.origin);document.querySelector('#status').textContent='조회 완료 · 원래 Haze Flow 자산 화면에서 확인해주세요.'}catch(error){opener.postMessage({type:'result',nonce,id:e.data.id,error:error.name==='TimeoutError'?'조회 시간이 길어졌어요.':error.message},e.origin);document.querySelector('#status').textContent='연결 상태를 확인해주세요.'}});</script></html>
