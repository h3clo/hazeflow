<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haze Flow · 디자인 비교</title><link rel="stylesheet" href="/design-samples.css"></head><body><header class="comparison-top"><div><span class="eyebrow">HAZE FLOW / DESIGN STUDY</span><h1>어떤 하루의 모습이 편할까?</h1><p>동일한 내용을 세 가지 화면으로 구성했어요. 예시 화면이며 실제 기록은 바뀌지 않아요.</p></div><a href="/">앱으로 돌아가기 ↗</a></header><nav class="choices" aria-label="디자인 선택"><button data-style="a" class="chosen"><b>A</b><span>간결한 데일리<small>밝게 · 담백하게 · 익숙하게</small></span></button><button data-style="b"><b>B</b><span>하루 노트<small>차분하게 · 흐름을 읽듯이</small></span></button><button data-style="c"><b>C</b><span>라이프 데스크<small>촘촘하게 · 한눈에 · 어둡게</small></span></button></nav><div class="preview-bar"><p id="description"></p><div><button data-size="desktop" class="chosen">넓은 화면</button><button data-size="mobile">모바일</button></div></div><div id="preview-wrap"><div id="preview" data-style="a"></div></div><p class="comparison-note">배경·색감·정보 배치를 비교해줘. A의 구조에 B의 색감처럼 섞어도 괜찮아. 버튼과 체크는 예시 화면 안에서만 동작해.</p><script type="module" src="/design-samples.js"></script></body></html>
